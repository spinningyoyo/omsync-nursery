name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # The runner has Google Chrome and its driver already; Selenium finds them. Since Ubuntu 23.10
      # an unprivileged process cannot make the user namespace that Chrome's sandbox needs unless
      # this is off, and the VM is thrown away after the job.
      - name: Let Chrome start its sandbox
        run: |
          google-chrome --version
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: uv sync --locked

      - run: sh scripts/check.sh

      - run: uv run pytest

      - run: uv build
