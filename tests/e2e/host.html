<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Nursery host</title>
<link rel="stylesheet" href="/scenes.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  canvas { position: fixed; left: 0; bottom: 0; image-rendering: pixelated; }
  #water { pointer-events: none; }
</style>
<!--
  A small stand-in for omsync's sign-in page. It does what the host code does: serves the engine
  from /static/vendor/nursery/, links scenes.css, and gives the engine a ground canvas behind a
  water canvas. The tests drive it from Selenium through window.host.

  With ?clock=fake the page owns time, so a test can run seconds of the engine in milliseconds:
  requestAnimationFrame and performance.now are replaced, and host.advance(ms) runs the frames.
  Math.random is seeded (?seed=N), so a run repeats. With ?clock=real nothing is replaced.
-->
</head>
<body>
<canvas id="ground"></canvas>
<canvas id="water"></canvas>
<script>
const query = new URLSearchParams(location.search);
window.__errors = [];
window.addEventListener("error", (e) => window.__errors.push(String(e.message)));
window.addEventListener("unhandledrejection", (e) => window.__errors.push(String(e.reason)));
const consoleError = console.error;
console.error = (...args) => { window.__errors.push(args.map(String).join(" ")); consoleError(...args); };

let seed = Number(query.get("seed") ?? 1) >>> 0;
window.__reseed = (value) => { seed = value >>> 0; };
Math.random = () => {  // mulberry32
  seed = (seed + 0x6d2b79f5) >>> 0;
  let t = seed;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};

let now = 1000;
const frames = new Map();
let frameId = 0;
if (query.get("clock") !== "real") {
  performance.now = () => now;
  window.requestAnimationFrame = (callback) => { frames.set(++frameId, callback); return frameId; };
  window.cancelAnimationFrame = (id) => { frames.delete(id); };
}
const STEP_MS = 1000 / 60;
</script>
<script type="module">
import * as engine from "/static/vendor/nursery/nursery.js";

const ground = document.getElementById("ground");
const water = document.getElementById("water");
const sceneList = await (await fetch("/scenes.json")).json();

const bottomRow = () => ground.getContext("2d").getImageData(0, ground.height - 1, ground.width, 1).data;

const host = {
  engine,
  sceneIds: sceneList.map((s) => s.id),
  nursery: null,
  make({ scene, stage = 0, reduced = false, theme = "light" }) {
    document.documentElement.dataset.theme = theme;
    this.nursery?.destroy();
    const found = engine.SCENES.find((s) => s.id === scene);
    this.nursery = new engine.Nursery({ ground, water, reducedMotion: reduced, scene: found, stage });
    return this.nursery.stage;
  },
  // Run the engine's frames for `ms` of page time, a whole number of 60 Hz frames.
  advance(ms) {
    for (let i = Math.round(ms / STEP_MS); i > 0; i -= 1) {
      now += STEP_MS;
      const due = [...frames];
      frames.clear();
      for (const [, callback] of due) callback(now);
    }
  },
  now: () => now,
  groundSize: () => ({ cols: ground.width, rows: ground.height }),
  // Non-transparent pixels of a canvas, optionally only in rows [y0, y1).
  covered(which, y0 = 0, y1 = Infinity) {
    const canvas = which === "water" ? water : ground;
    const { data } = canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height);
    let count = 0;
    for (let y = y0; y < Math.min(y1, canvas.height); y += 1) {
      for (let x = 0; x < canvas.width; x += 1) if (data[(y * canvas.width + x) * 4 + 3]) count += 1;
    }
    return count;
  },
  // A cheap fingerprint of a canvas, to tell whether it changed.
  fingerprint(which) {
    const canvas = which === "water" ? water : ground;
    const { data } = canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height);
    let hash = 2166136261;
    for (let i = 0; i < data.length; i += 1) hash = Math.imul(hash ^ data[i], 16777619) >>> 0;
    return hash;
  },
  // Start the random numbers again, so that two scenes made after it get the same plants.
  reseed: (value) => window.__reseed(value),
  // Keep the ground canvas under a name; pixelsDiffering then counts the pixels in which two kept
  // canvases differ.
  keep(name) {
    this.kept ??= {};
    this.kept[name] = ground.getContext("2d").getImageData(0, 0, ground.width, ground.height).data;
  },
  pixelsDiffering(a, b) {
    let count = 0;
    const [x, y] = [this.kept[a], this.kept[b]];
    for (let i = 0; i < x.length; i += 4) {
      if (x[i] !== y[i] || x[i + 1] !== y[i + 1] || x[i + 2] !== y[i + 2] || x[i + 3] !== y[i + 3]) count += 1;
    }
    return count;
  },
  // The bottom row of the ground canvas is soil, and a wet column is tinted there. keepDryRow notes
  // the dry row; wetColumns then runs the engine for `ms` and returns every column that differed from
  // it at any time, which are the columns that drops landed on.
  keepDryRow() {
    this.dry = bottomRow();
  },
  wetColumns(ms, stepMs = 100) {
    const wet = new Set();
    for (let t = 0; t < ms; t += stepMs) {
      this.advance(stepMs);
      const row = bottomRow();
      for (let x = 0; x < ground.width; x += 1) {
        for (let k = 0; k < 4; k += 1) if (row[x * 4 + k] !== this.dry[x * 4 + k]) wet.add(x);
      }
    }
    return [...wet].sort((a, b) => a - b);
  },
  // Whether the engine's fountain is still running (an existing field; the contract has no signal).
  fountainOn: () => Boolean(host.nursery?.fountain),
};
window.host = host;
window.__ready = true;
</script>
</body>
</html>
