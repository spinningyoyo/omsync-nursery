<!doctype html><meta charset="utf-8"><body style="margin:0">
<script type="module">
import { Forest, SCENES, MAX_STAGE } from "./js/forest_scene.js";
const q = new URLSearchParams(location.search);
const id = q.get("scene"), stage = +(q.get("stage") ?? MAX_STAGE), secs = +(q.get("secs") ?? 40);
const shots = (q.get("shots") ?? "0").split(",").map(Number); // extra seconds after secs to capture
const zoom = +(q.get("zoom") ?? 4);
const out = [];
try {
  const scene = SCENES.find((s) => s.id === id);
  for (const theme of (q.get("themes") ?? "light,dark").split(",")) {
    document.documentElement.dataset.theme = theme;
    const ground = document.createElement("canvas"), water = document.createElement("canvas");
    const f = new Forest({ ground, water, reducedMotion: false, scene, stage: 0 });
    f.destroy();
    const dt = 1 / 30;
    for (let s = 0; s <= stage; s += 1) {
      f.stage = s;
      for (const p of f.plants) p.shown = p.target = s;
      scene.extras?.onGrow?.(f);
      const n = Math.round((s === stage ? secs : 4) / dt);
      for (let i = 0; i < n; i += 1) { f.time += dt; scene.extras?.update?.(f, dt); }
    }
    let t = 0;
    for (const shot of shots) {
      while (t < shot) { f.time += dt; scene.extras?.update?.(f, dt); t += dt; }
      f.dirty = true; f.drawForest();
      const c = document.createElement("canvas");
      c.width = f.cols * zoom; c.height = f.rows * zoom;
      const x = c.getContext("2d"); x.imageSmoothingEnabled = false;
      x.fillStyle = scene.palettes[theme].haze; x.fillRect(0, 0, c.width, c.height);
      x.drawImage(ground, 0, 0, c.width, c.height); x.drawImage(water, 0, 0, c.width, c.height);
      const probe = {};
      for (const [k, v] of Object.entries(f.extra ?? {})) {
        const one = (o) => o && typeof o === "object" && ("active" in o ? (o.active ? Math.round(o.x) : "-") : "bird" in o ? (o.bird ? "fly" : "-") : "x" in o ? "at " + Math.round(o.x) : null);
        if (Array.isArray(v) && v.length <= 8) probe[k] = v.map(one).filter((q) => q !== null).join(",");
        else { const r = one(v); if (r !== null) probe[k] = r; }
      }
      out.push({ name: `${id}-${theme}-${shot}`, url: c.toDataURL(), probe });
    }
  }
  window.result = out;
} catch (e) { window.result = { error: String(e.stack || e) }; }
</script>
